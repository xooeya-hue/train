<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Тренерский журнал</title>
<meta name="theme-color" content="#0D6A5A">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: одна колонка, как страница тренировочного журнала. Сверху шапка, дальше список клиентов, анкета или план. */
:root{
  --bg:#EEF0ED;--surface:#FFFFFF;--surface2:#F4F6F3;--ink:#14191A;--muted:#5B6568;--line:#D6DBD7;
  --accent:#0D6A5A;--accent-ink:#FFFFFF;--accent-soft:#DCEEE9;
  --warn:#7A4E00;--warn-bg:#FAEFD3;--danger:#A3231A;--danger-bg:#FBE3E0;--info:#2B4A66;--info-bg:#E4EBF2;
  --f-display:'Avenir Next Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  --f-body:-apple-system,'SF Pro Text','Segoe UI',system-ui,Roboto,sans-serif;
  --f-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1415;--surface:#171D1E;--surface2:#1D2526;--ink:#E7ECEA;--muted:#9AA6A7;--line:#2B3537;
    --accent:#4DC2A5;--accent-ink:#06201A;--accent-soft:#17332E;
    --warn:#F0C26B;--warn-bg:#3A2D12;--danger:#FF9A8F;--danger-bg:#3F1B18;--info:#9CC2E6;--info-bg:#1A2733;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1415;--surface:#171D1E;--surface2:#1D2526;--ink:#E7ECEA;--muted:#9AA6A7;--line:#2B3537;
  --accent:#4DC2A5;--accent-ink:#06201A;--accent-soft:#17332E;
  --warn:#F0C26B;--warn-bg:#3A2D12;--danger:#FF9A8F;--danger-bg:#3F1B18;--info:#9CC2E6;--info-bg:#1A2733;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.small{font-size:13px}
h1,h2,h3{margin:0}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.brand h1{font:600 24px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
h2{font:600 20px/1.15 var(--f-display);letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h3{font:600 12px/1.2 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.btn{min-height:44px;padding:0 16px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font:600 14px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.card.flat{background:var(--surface2)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font:500 12px var(--f-body)}
.tag.plain{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.tag.hand{background:var(--info-bg);color:var(--info)}
/* clients */
.clist{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.cbtn{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;cursor:pointer;color:var(--ink);font:inherit;display:flex;flex-direction:column;gap:8px}
.cbtn:hover{border-color:var(--accent)}
.cbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cname{font:600 18px/1.2 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
/* form */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font:500 12px var(--f-body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:500 14px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.err{color:var(--danger);font-size:13px}
fieldset{border:0;margin:0;padding:0;min-width:0}
/* banners */
.banner{border-radius:8px;padding:10px 12px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner b{flex:none;font:600 11px var(--f-body);letter-spacing:.09em;text-transform:uppercase;padding:3px 6px;border-radius:4px;margin-top:1px}
.banner.stop{background:var(--danger-bg);border:1px solid var(--danger)}
.banner.stop b{background:var(--danger);color:var(--surface)}
.banner.doctor{background:var(--danger-bg);border:1px solid var(--danger)}
.banner.doctor b{background:var(--danger);color:var(--surface)}
.banner.care{background:var(--warn-bg);border:1px solid var(--warn)}
.banner.care b{background:var(--warn);color:var(--surface)}
.banner.info{background:var(--info-bg);border:1px solid var(--info)}
.banner.info b{background:var(--info);color:var(--surface)}
/* plan */
.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wk{min-height:52px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
.wk .n{font:600 16px var(--f-display);letter-spacing:.04em}
.wk .s{font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.wk[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk[aria-pressed="true"] .s{color:var(--accent-ink)}
.dayhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.dayhead .k{font:500 12px var(--f-mono);color:var(--muted)}
.ex{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.ex .no{font:500 13px var(--f-mono);color:var(--muted);padding-top:2px}
.ex .nm{font-weight:600;overflow-wrap:anywhere}
.ex .cue{color:var(--muted);font-size:13px;margin-top:2px}
.ex .sc{font:500 17px var(--f-mono);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex.wide{grid-template-columns:22px minmax(0,1fr)}
.ex.wide>div:last-child{grid-column:2;text-align:left}
.ex.wide .sc,.ex.wide .meta{text-align:left}
.ex .sc.long{font-size:14px;line-height:1.35;white-space:normal;overflow-wrap:anywhere}
.ex .meta{font:400 12px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.ex .tools{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.alts{grid-column:1/-1;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;flex-direction:column;gap:6px}
.alts button{min-height:40px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
.alts button:hover{border-color:var(--accent)}
details{border-top:1px solid var(--line);padding-top:8px}
details+details{margin-top:6px}
summary{cursor:pointer;font-weight:600;min-height:32px;display:flex;align-items:center}
details ul{margin:6px 0 6px 18px;padding:0;display:flex;flex-direction:column;gap:4px}
.cardio{margin-top:8px;padding:10px;border-radius:6px;background:var(--surface2);font-size:14px}
.prog{display:flex;flex-direction:column;gap:8px}
.prog .r{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:8px 0;border-top:1px solid var(--line)}
.prog .r .w{font:600 14px var(--f-display);letter-spacing:.04em;white-space:nowrap}
.prog .r .m{font:400 13px var(--f-mono);color:var(--muted)}
.log{display:flex;flex-direction:column}
.log .li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log .li .v{font:500 14px var(--f-mono)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.card,.cbtn,.btn,.chip,.wk{transition:border-color .15s,background-color .15s}}
</style>
</head>

function makeCtx(c){
  const age=clamp(Math.round(+c.age)||30,8,90);
  const flags=new Set((c.flags||[]).filter(f=>FLAGS[f]));
  const h=+c.height,w=+c.weight;
  let bmi=null;
  if(h>100&&w>25){bmi=w/Math.pow(h/100,2);if(bmi>=30)flags.add('obese');}

    return {blocked:true,banners,name:c.name||'',flags};
  }
  const level=clamp(Math.round(+c.level)||0,0,3);
  const days=clamp(Math.round(+c.days)||3,2,5);
  const minutes=[45,60,90].includes(+c.minutes)?+c.minutes:60;
  const eqKey=EQUIP[c.equip]?c.equip:'gym';
  const accent=ACCENTS[c.accent]?c.accent:'none';
  const month=clamp(Math.round(+c.month)||1,1,24);
  let noCardio=false;
  if(bmi!==null&&bmi<18.5){
    noCardio=true;
    if(goal==='fat'){
      goal='tone';
      banners.push({t:'care',text:`ИМТ ${bmi.toFixed(1)}: снижать вес не рекомендуется. Цель заменена на «Тонус и общая форма», кардио в конце тренировок убрано. Питание и вес обсудите с врачом.`});
    }else banners.push({t:'care',text:`ИМТ ${bmi.toFixed(1)} ниже нормы. Кардио в конце тренировок убрано, питание и вес обсудите с врачом.`});
  }
  const gentle=flags.has('preg')||flags.has('post')||flags.has('osteo')||goal==='rehab'||age>=65||age<14;
  const scheme=gentle?'gentle':goal;
  let maxLv=level===0?1:level===1?2:3;
  if(gentle)maxLv=1;else if(age<18||age>=60)maxLv=Math.min(maxLv,2);
  const heavy=scheme==='strength'&&!(level===0||age<18||flags.has('bp')||age>=55);
  let pref;
  if(gentle||age>=55||level===0)pref={mach:4,db:3,bw:3,band:2,bb:1};
  else if(level>=2&&(scheme==='muscle'||scheme==='strength'))pref={bb:4,db:3,mach:2.5,bw:2,band:1};
  else pref={db:3.5,mach:3,bb:2.5,bw:2.5,band:1.5};
  const lowImp=gentle||age>=55||flags.has('knee')||flags.has('obese')||flags.has('osteo');
  const cardioPart=(age>=50||gentle)?8:5;
  const warmMin=cardioPart+4;

  let method=(c.method&&METHODS[c.method])?c.method:'auto';
  if(method!=='auto'){
    const why=[];
    if(age<18||age>=60)why.push('подходит для возраста 18–59 лет');
    if(eqKey!=='gym')why.push('нужен полный зал');
    if(level<1)why.push('нужен опыт хотя бы несколько месяцев');
    if(gentle)why.push('у клиента щадящий режим');
    const bl=METHOD_BLOCK.filter(f=>flags.has(f));
    if(bl.length)why.push('ограничения по здоровью ('+bl.map(f=>FLAGS[f].l.toLowerCase()).join(', ')+')');
    if(why.length){banners.push({t:'care',text:`Методика «${METHODS[method]}» не подходит: ${why.join('; ')}. Использован подбор под клиента.`});method='auto';}
  }
  const heavyF=method!=='auto'?true:heavy;
  const doc=['bp','preg','post','osteo'].filter(f=>flags.has(f));
  if(doc.length)banners.push({t:'doctor',text:`Перед стартом нужна консультация врача: ${doc.map(f=>FLAGS[f].l.toLowerCase()).join(', ')}. План составлен в щадящем режиме, окончательное решение за врачом и тренером.`});
  if(bmi!==null&&bmi>=35)banners.push({t:'doctor',text:`ИМТ ${bmi.toFixed(1)}. Старт и нагрузку согласуйте с врачом.`});
  if(age>=60)banners.push({t:'care',text:'С 60 лет рекомендуем пройти медосмотр перед стартом. В плане больше опор и тренажёров, разминка длиннее, добавлен баланс.'});

  else if(age<18)banners.push({t:'info',text:'Подросток: без максимальных весов и отказных подходов, техника важнее нагрузки.'});
  if(flags.has('diab'))banners.push({t:'care',text:FLAGS.diab.n});

  return {blocked:false,name:String(c.name||'').trim()||'Клиент',age,sex:c.sex==='m'?'m':'f',bmi,flags,goal,level,days,minutes,eqKey,eq:EQ_SETS[eqKey],accent,month,gentle,scheme,maxLv,heavy:heavyF,method,pref,lowImp,noCardio,cardioPart,warmMin,banners,weight:w>25?w:null};
}

function splitFor(ctx){
  const d=ctx.days,lv=ctx.level;
  if(d<=2)return['FA','FB'];
  if(d===3)return(lv>=2&&(ctx.scheme==='muscle'||ctx.scheme==='strength')&&!ctx.gentle)?['PUSH','PULL','LEGS']:['FA','FB','FC'];
  if(d===4)return['UA','LA','UB','LB'];
  return(lv>=2&&!ctx.gentle)?['PUSH','PULL','LEGS','UA','LB']:['UA','LA','UB','LB','FC'];
}

function candidates(slot,ctx,used){
  const out=[];
  Object.keys(EX).forEach(id=>{
    const e=EX[id];
    const pi=slot.p.indexOf(e.p);
    if(pi<0)return;
    if(!ctx.eq.has(e.eq))return;
    if(e.lv>ctx.maxLv)return;
    if(e.ex.some(f=>ctx.flags.has(f)))return;
    if(used&&used.has(e.id))return;
    let s=(slot.p.length-pi)*20+(ctx.pref[e.eq]||0)*2+((ctx.level>=2&&!ctx.gentle)?e.lv*1.2:0);
    if(slot.want&&e.t.includes(slot.want))s+=8;
    if(ctx.accent!=='none'&&slot.r!=='main'&&e.t.includes(ctx.accent))s+=3;
    if((ctx.gentle||ctx.flags.has('back')||ctx.flags.has('knee')||ctx.flags.has('osteo'))&&e.t.includes('supp'))s+=4;
    if((ctx.flags.has('shoulder')||ctx.flags.has('wrist'))&&e.t.includes('neutral'))s+=4;
    if(ctx.lowImp&&e.t.includes('lowimp'))s+=6;
    out.push({e,s});
  });
  out.sort((a,b)=>(b.s-a.s)||(a.e.id<b.e.id?-1:1));
  return out.map(o=>o.e);
}

function pick(slot,ctx,used,d,s,dayUsed){
  let c=candidates(slot,ctx,used);
  if(!c.length&&dayUsed)c=candidates(slot,ctx,dayUsed);
  if(!c.length)return null;
  const top=Math.min(c.length,slot.r==='main'?2:3);
  const idx=(slot.r==='main'?(ctx.month-1):(hash(ctx.name+':'+d+':'+s)+ctx.month-1))%top;
  return c[idx];
}

function baseScheme(ctx,role){
  let b={...SCHEME[ctx.scheme][role]};
  if(ctx.scheme==='strength'&&!ctx.heavy){
    b={...SCHEME.muscle[role]};
    if(role==='main'){b.lo=5;b.hi=8;b.s=3;b.r=150;}
  }
  if(ctx.flags.has('bp')){b.lo=Math.max(b.lo,8);b.hi=Math.max(b.hi,b.lo+3);b.r+=30;}
  if(ctx.age<18){b.lo=Math.max(b.lo,6);b.hi=Math.max(b.hi,b.lo+2);}
  if(ctx.level===0&&!ctx.gentle)b.s=Math.min(b.s,role==='main'?3:2);
  return b;
}
function rpeFor(ctx,w){
  const T=[[5,6,7,5],[6,7,8,6],[7,8,8,6],[7,8,9,6]];
  let r=T[ctx.level][w-1];
  if(ctx.gentle)r=[5,6,6,5][w-1];
  else if(ctx.age>=50||ctx.age<18||ctx.flags.has('bp'))r=Math.min(r,7);
  return r;
}
function weekScheme(ctx,role,ex,w){
  const b=baseScheme(ctx,role);
  let sets=b.s;
  if(w===1&&ctx.level<=1&&b.s>2)sets=b.s-1;
  if(w===3&&role==='main'&&ctx.level>=1&&!ctx.gentle)sets=Math.min(5,b.s+1);
  if(w===4)sets=Math.max(2,b.s-1);
  const rpe=rpeFor(ctx,w);
  const t=ex?ex.t:[];
  let reps,work=40,unit='reps';
  if(t.includes('s')){const base=ctx.gentle?20:(ctx.level>=2?40:30);const v=w===4?base:base+5*(w-1);reps=v+' с';work=v;unit='sec';}
  else if(t.includes('m')){const v=w===4?20:20+5*(w-1);reps=v+' м';unit='m';}
  else reps=b.lo+'–'+b.hi;
  if(t.includes('u')){reps+=' на сторону';work*=2;}
  return{sets,reps,rest:b.r,rpe,rir:10-rpe,unit,work};
}
function restTxt(s){return s<120?s+' с':(s/60).toString().replace('.',',')+' мин';}

function cardioFor(ctx){
  if(ctx.noCardio)return null;
  let mins=null,txt=null;
  const easy3='Ровный темп, чуть дольше обычного';
  if(ctx.gentle){mins=[8,10,12,8];txt=['Спокойный темп, дыхание свободное','Спокойный темп','Спокойный темп, чуть дольше','Лёгкий темп'];}
  else if(ctx.goal==='fat'){
    mins=[12,15,18,10];
    const safe=ctx.flags.has('bp')||ctx.flags.has('obese')||ctx.flags.has('knee')||ctx.age>=50;
    txt=['Ровный темп, можно разговаривать','Ровный темп, чуть выше скорость или наклон',safe?easy3:'Каждые 4 мин по 1 мин быстрее обычного, если самочувствие хорошее','Лёгкий темп, восстановление'];
  }
  else if(ctx.goal==='tone'){mins=[8,10,12,8];txt=['Ровный темп','Ровный темп','Ровный темп, чуть дольше','Лёгкий темп'];}
  if(!mins)return null;
  const cap=Math.max(5,Math.floor((ctx.minutes-ctx.warmMin-5)*0.25));
  return{mins:mins.map(m=>Math.min(m,cap)),txt};
}

function warmup(ctx,kind){
  const up=['UA','UB','PUSH','PULL'].includes(kind),low=['LA','LB','LEGS'].includes(kind),full=kind[0]==='F';
  const a=[];
  a.push(ctx.eqKey==='home'?`${ctx.cardioPart} мин: ходьба на месте, шаги, круги суставами`:`${ctx.cardioPart} мин лёгкого кардио (дорожка, велотренажёр или эллипс) до лёгкой испарины`);
  if(low||full)a.push('Таз и ноги: круги тазом, мостик 2×12, присед с собственным весом 2×10');
  if(up||full)a.push('Плечи и спина: круги плечами, разведение резины 2×15, лопаточные отжимания 2×10');
  if(ctx.flags.has('back'))a.push('Для спины: «кошка-корова» 8 повторов, «птица-собака» 2×6 на сторону');
  if(ctx.flags.has('knee'))a.push('Для коленей: раскрытие колен лёжа с резиной 2×12 на сторону');
  if(ctx.flags.has('shoulder'))a.push('Для плеч: наружная ротация плеча с резиной 2×15');
  if(ctx.age>=60)a.push('Баланс: стойка на одной ноге 2×20 с на каждую, рядом с опорой');
  a.push(ctx.heavy?'Подводящие подходы к первому базовому: 50% ×8, 70% ×5, 85% ×2':'Подводящие подходы к первому базовому: 1–2 подхода с лёгким весом по 8–10 повторов');
  return a;
}
function cooldown(ctx){
  const a=['3–5 мин спокойной ходьбы, пульс снижаем','Растяжка 4–6 мышц, которые работали, по 30 с без боли','6 медленных вдохов и выдохов'];
  if(ctx.flags.has('diab'))a.push('Проверьте глюкозу и перекусите по рекомендации врача');
  return a;
}

function estSlot(ctx,role){const sc=weekScheme(ctx,role,null,3);return sc.sets*(40+sc.rest)/60+0.7;}

function buildProgram(c){
  const ctx=makeCtx(c);
  if(ctx.blocked)return{blocked:true,banners:ctx.banners,ctx};
  if(ctx.method!=='auto')return buildMethodProgram(c,ctx);
  const tpls=splitFor(ctx);
  const cardio=cardioFor(ctx);
  const swaps=c.swaps||{};
  const used=new Set();
  let trimmedAny=false;
  const accState={n:0};
  const days=tpls.map((k,d)=>{
    const slots=TPL[k].map((s,i)=>({...s,idx:i,acx:false}));
    const rule=ACC[ctx.accent];
    if(rule&&rule.kinds.includes(k)&&accState.n<rule.max){
      accState.n++;
      rule.slots.forEach((s,i)=>slots.push({...s,idx:100+i,acx:true}));
    }
    const avail=ctx.minutes-ctx.warmMin-5-(cardio?cardio.mins[2]:0);
    const total=()=>slots.reduce((m,s)=>m+estSlot(ctx,s.r),0);
    while(total()>avail+3&&slots.filter(s=>!s.acx).length>4){
      let j=-1;for(let i=slots.length-1;i>=0;i--){if(!slots[i].acx){j=i;break;}}
      slots.splice(j,1);trimmedAny=true;
    }
    const out=[];
    const dayUsed=new Set();
    slots.forEach((s,i)=>{
      const key=`d${d}_${k}_${s.idx}`;
      let ex=null;
      if(swaps[key]&&EX[swaps[key]]&&!dayUsed.has(swaps[key]))ex=EX[swaps[key]];
      const manual=!!ex;
      if(!ex)ex=pick(s,ctx,used,d,s.idx,dayUsed);
      if(!ex)return;
      used.add(ex.id);dayUsed.add(ex.id);
      out.push({key,role:s.r,slot:s,ex,acx:s.acx,manual});
    });
    let cd=null;
    if(cardio){
      const cc=candidates(sl('cd','acc'),ctx,null);
      if(cc.length)cd=cc[d%Math.min(2,cc.length)];
    }
    return{kind:k,title:TITLES[k],slots:out,cardioEx:cd,warm:warmup(ctx,k),cool:cooldown(ctx)};
  });
  return{blocked:false,ctx,banners:ctx.banners,days,cardio,used,trimmed:trimmedAny,accounted:accountedLines(ctx,tpls,trimmedAny)};
}

function dayMinutes(prog,day,w){
  const ctx=prog.ctx;
  let m=ctx.warmMin+5;
  day.slots.forEach(s=>{const sc=slotSch(ctx,s,w);m+=sc.sets*(sc.work+sc.rest)/60+0.7;});
  if(prog.cardio&&day.cardioEx)m+=prog.cardio.mins[w-1];
  return Math.round(m/5)*5;
}

function weekTip(ctx,w){
  if(ctx.method&&ctx.method!=='auto')return methodTip(ctx.method,w);
  if(w===1)return'Подбираем рабочие веса с запасом повторов. Главное сейчас техника и привычка к режиму.';
  if(w===2)return'Все подходы по плану. Старайся дойти до верхней границы диапазона повторов с чистой техникой.';
  if(w===3)return(ctx.level>=1&&!ctx.gentle)?'На базовых упражнениях на один подход больше. Если повторы прошлой недели вышли чисто, добавь 2,5–5% веса и вернись к нижней границе диапазона.':'Если повторы прошлой недели вышли чисто, добавь 2,5–5% веса. Число подходов то же.';
  return'Подходов на один меньше, вес примерно на 10% ниже. В конце недели замеры и фото для сравнения.';
}

function progressionRows(prog){
  const ctx=prog.ctx;
  return[1,2,3,4].map(w=>{
    const all=prog.days.flatMap(d=>d.slots);
    const ms=all.find(s=>s.role==='main')||all[0];
    const as=all.find(s=>s.role==='acc'||s.role==='core')||all[all.length-1];
    const gen=(s)=>s.sch?s.sch(w):weekScheme(ctx,s.role,null,w);
    const m=gen(ms),a=gen(as);
    return{w,name:WEEK_NAMES[w-1],main:fmtSc(m),acc:fmtSc(a),rpe:m.rpe,rir:m.rir,cardio:prog.cardio?prog.cardio.mins[w-1]:null,tip:weekTip(ctx,w)};
  });
}

function accountedLines(ctx,tpls,trimmed){
  const a=[];
  a.push(`Уровень: ${LEVELS[ctx.level].toLowerCase()}. ${ctx.maxLv===1?'Только простые упражнения с опорой, без сложной техники.':ctx.maxLv===2?'Без самых технически сложных упражнений.':'Доступны все базовые упражнения со штангой.'}`);
  a.push(`Схема: ${ctx.days} ${ctx.days<5?'тренировки':'тренировок'} в неделю, ${tpls.map(k=>TITLES[k]).join(' / ')}.`);
  a.push(`Инвентарь: ${EQUIP[ctx.eqKey].toLowerCase()}.`);
  if(ctx.gentle)a.push('Щадящий режим: 2 подхода по 12–15 повторов, RPE не выше 6, простые упражнения.');
  if(ctx.accent!=='none')a.push(`Акцент: ${ACCENTS[ctx.accent].toLowerCase()}. Добавлены упражнения на этой неделе в ${ACC[ctx.accent].max} тренировки.`);
  if(ctx.month>1)a.push(`Месяц ${ctx.month}: часть упражнений заменена относительно первого месяца, чтобы нагрузка не приедалась.`);
  FLAG_ORDER.filter(f=>ctx.flags.has(f)&&f!=='cardiac').forEach(f=>a.push(`${FLAGS[f].l}: ${FLAGS[f].n}`));
  if(trimmed)a.push(`Под длительность ${ctx.minutes} мин часть второстепенных упражнений убрана.`);
  return a;
}

function lifestyle(ctx){
  const a=['Сон 7–9 часов, особенно в неделю прибавки нагрузки.'];
  const steps=ctx.gentle?'5 000–7 000 шагов в день, добавляйте постепенно':ctx.goal==='fat'?'8 000–10 000 шагов в день':'7 000–9 000 шагов в день';
  a.push(`Шаги: ${steps}.`);
  const careful=ctx.flags.has('obese')||ctx.flags.has('diab')||ctx.flags.has('bp')||ctx.flags.has('preg')||ctx.flags.has('post')||ctx.flags.has('osteo')||ctx.age>=60||ctx.age<18;
  if(careful||!ctx.weight)a.push('Белок и общая калорийность: согласуйте с врачом или диетологом.');
  else{
    const r={muscle:[1.6,2.2],strength:[1.6,2.0],fat:[1.6,2.0],tone:[1.4,1.8],gentle:[1.2,1.6]}[ctx.scheme];
    const f=x=>Math.round(x*ctx.weight/5)*5;
    a.push(`Белок: ориентир ${f(r[0])}–${f(r[1])} г в день при весе ${ctx.weight} кг.`);
  }
  a.push('Вода в течение дня, на тренировку с собой бутылка.');
  return a;
}

function planText(c,prog,w){
  const ctx=prog.ctx;
  const weeks=w==='all'?[1,2,3,4]:[w];
  const L=[];
  L.push(`${ctx.name}: ${GOALS[c.goal]||''}`);
  L.push(`${ctx.days} тренировки в неделю, ~${ctx.minutes} мин, ${EQUIP[ctx.eqKey].toLowerCase()}`);
  if(ctx.method!=='auto')L.push('Методика: '+METHODS[ctx.method]);
  weeks.forEach(wk=>{
    L.push('');L.push(`НЕДЕЛЯ ${wk}: ${WEEK_NAMES[wk-1]}`);
    L.push(weekTip(ctx,wk));
    prog.days.forEach((day,d)=>{
      L.push('');
      L.push(`День ${d+1} (${WEEKDAYS[ctx.days][d]}) · ${day.title} · ~${dayMinutes(prog,day,wk)} мин`);
      L.push('Разминка: '+day.warm[0]+'; '+day.warm[day.warm.length-1].toLowerCase());
      day.slots.forEach((s,i)=>{
        const sc=slotSch(ctx,s,wk);
        L.push(`${i+1}. ${s.ex.n}: ${fmtSc(sc)}, отдых ${restTxt(sc.rest)}, RPE ${sc.rpe}`);
      });
      if(prog.cardio&&day.cardioEx)L.push(`Кардио: ${day.cardioEx.n}, ${prog.cardio.mins[wk-1]} мин. ${prog.cardio.txt[wk-1]}`);
    });
  });
  L.push('');L.push('RPE: оценка тяжести подхода из 10. RPE 7 значит, что в запасе ещё около 3 повторов.');
  return L.join('\n');
}
/* ---- методики известных программ ---- */
const fmtSc=sc=>sc.txt||`${sc.sets}×${sc.reps}`;
function slotSch(ctx,s,w){return s.sch?s.sch(w):weekScheme(ctx,s.role,s.ex,w);}
const suf=ex=>ex&&ex.t.includes('u')?' на сторону':'';
function mkSch(ctx,ex,setsArr,reps,rest){
  const u=ex.t.includes('u');
  return w=>{const rpe=rpeFor(ctx,w);return{sets:setsArr[w-1],reps:reps+(u?' на сторону':''),rest,rpe,rir:10-rpe,unit:'reps',work:u?80:40};};
}
function mkTxt(ctx,ex,fn,rest){
  const u=suf(ex);
  return w=>{const rpe=rpeFor(ctx,w);const o=fn(w);return{sets:o.sets,reps:'',txt:o.txt+u,rest,rpe,rir:10-rpe,unit:'reps',work:u?80:40};};
}
const SC=(setsArr,reps,rest)=>(ctx,ex)=>mkSch(ctx,ex,setsArr,reps,rest);
const TX=(fn,rest)=>(ctx,ex)=>mkTxt(ctx,ex,fn,rest);
const LF=(ids,pat,role,sc)=>({ids,slot:sl(pat,role),role,sc});
const AF=(pat,role,sc)=>({ids:null,slot:sl(pat,role),role,sc});

  const T={

    sl5:['Начни с лёгкого веса: все подходы 5×5 должны выходить чисто. Выполнил все повторы во всех подходах — в следующий раз добавь вес.','Прибавки, как в оригинале: на присед и тягу по 2,5–5 кг, на жим, жим стоя и тягу по 1,25–2,5 кг. Не вышло — повтори тот же вес. Приседаешь на каждой тренировке, поэтому порядок A и B чередуется: на второй неделе B, A, B.','Если прогресс замедлился, делай прибавки поменьше.','Разгрузка (добавлена нами, в оригинале её нет): 3 подхода по 5 с весом около 90% от рабочего.'],
    w531:['Тренировочный максимум (TM) около 85–90% от максимума на 1 повтор, новичку лучше взять 85%. Проценты считаются от TM. Подходы со знаком «+»: максимум повторов, но с запасом 1–2 повтора.','Неделя троек: веса выше, повторов меньше.','Неделя 5/3/1: самые тяжёлые подходы цикла, последний на 1+ повторов.','Разгрузка: лёгкие подходы по 5. Перед новым циклом TM вырастает на 2,5 кг для жимов и на 5 кг для приседа и тяги.']
  };
  return T[m][w-1];
}
const METHOD_SRC={

function mpick(ids,slot,ctx,dayUsed,role){
  const ok=ids.map(id=>EX[id]).filter(e=>e&&ctx.eq.has(e.eq)&&!e.ex.some(f=>ctx.flags.has(f))&&!dayUsed.has(e.id));
  if(ok.length)return ok[role==='main'?0:(ctx.month-1)%ok.length];
  return pick(slot,{...ctx,maxLv:3},dayUsed,0,0,dayUsed);
}

function buildMethodProgram(c,ctx){
  const want=ctx.days;
  const def=METHOD_DEFS[ctx.method](ctx);
  ctx.days=def.length;
  const swaps=c.swaps||{};
  const used=new Set();
  const cardio=cardioFor(ctx);
  const days=def.map((dd,d)=>{
    const dayUsed=new Set();
    const out=[];
    dd.slots.forEach((s,i)=>{
      const key=`m${d}_${i}`;
      let ex=null;
      if(swaps[key]&&EX[swaps[key]]&&!dayUsed.has(swaps[key]))ex=EX[swaps[key]];
      const manual=!!ex;
      if(!ex)ex=s.ids?mpick(s.ids,s.slot,ctx,dayUsed,s.role):pick(s.slot,ctx,dayUsed,d,i,dayUsed);
      if(!ex)return;
      dayUsed.add(ex.id);used.add(ex.id);
      const timed=ex.t.includes('s')||ex.t.includes('m');
      out.push({key,role:s.role,slot:s.slot,ex,acx:false,manual,sch:(s.sc&&!timed)?s.sc(ctx,ex):null});
    });
    let cd=null;
    if(cardio){const cc=candidates(sl('cd','acc'),ctx,null);if(cc.length)cd=cc[d%Math.min(2,cc.length)];}
    return{kind:dd.kind,title:dd.title,slots:out,cardioEx:cd,warm:warmup(ctx,dd.kind),cool:cooldown(ctx)};
  });
  const prog={blocked:false,ctx,banners:ctx.banners.slice(),days,cardio,used,trimmed:false,method:true};
  if(want!==def.length)prog.banners.push({t:'info',text:`Методика «${METHODS[ctx.method]}» даёт ${def.length} ${def.length<5?'тренировки':'тренировок'} в неделю, в анкете было ${want}.`});
  const mx=Math.max(...days.map(d=>dayMinutes(prog,d,3)));
  if(mx>ctx.minutes+10)prog.banners.push({t:'info',text:`По методике тренировка занимает около ${mx} мин, дольше выбранных ${ctx.minutes}. Подходы не сокращались, чтобы не ломать методику.`});
  const a=[METHOD_SRC[ctx.method],'Это адаптация общей структуры методики, а не её полная копия: упражнения подбираются под инвентарь и ограничения клиента, добавлена разгрузочная неделя.',`Опыт: ${LEVELS[ctx.level].toLowerCase()}.`,`Инвентарь: ${EQUIP[ctx.eqKey].toLowerCase()}.`];
  if(ctx.accent!=='none')a.push('Акцент в этой методике не используется.');
  if(ctx.month>1)a.push(`Месяц ${ctx.month}: вспомогательные упражнения заменены относительно первого месяца.`);
  FLAG_ORDER.filter(f=>ctx.flags.has(f)&&f!=='cardiac').forEach(f=>a.push(`${FLAGS[f].l}: ${FLAGS[f].n}`));
  prog.accounted=a;
  return prog;
}
/*ENGINE_END*/

function el(tag,props,...kids){
  const n=document.createElement(tag);
  if(props){for(const k in props){const v=props[k];if(v==null||v===false)continue;
    if(k==='class')n.className=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?'':v);}}
  kids.flat(Infinity).forEach(c=>{if(c==null||c===false)return;n.append(c.nodeType?c:document.createTextNode(String(c)));});
  return n;
}

async function saveClient(c,keepTime){

async function exportBackup(){
  const json=JSON.stringify({app:'trener-zhurnal',version:1,saved:new Date().toISOString(),clients:S.clients},null,1);
  const name=`zhurnal-kopiya-${today()}.json`;
  try{

    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});lsSet(LS_BK,String(Date.now()));render();return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  try{await navigator.clipboard.writeText(json);lsSet(LS_BK,String(Date.now()));toast('Копия скопирована. Вставьте её в заметки.');render();return;}catch(e){}
  S.copyBox=json;lsSet(LS_BK,String(Date.now()));render();
}
async function importBackup(text){
  let data;
  try{data=JSON.parse(text);}catch(e){toast('Это не файл копии.');return;}
  const list=Array.isArray(data)?data:(data&&Array.isArray(data.clients)?data.clients:null);
  if(!list){toast('В файле нет клиентов.');return;}
  let n=0;
  for(const raw of list){
    if(!raw||typeof raw!=='object'||!raw.name)continue;
    const c=clone(raw);
    c.id=String(c.id||newId()).replace(/[^A-Za-z0-9_\-.~:@+]/g,'_').slice(0,100);
    const have=S.clients.find(x=>x.id===c.id);
    if(have&&(have.updated||0)>=(c.updated||0))continue;
    c.name=String(c.name).slice(0,100);
    c.swaps=(c.swaps&&typeof c.swaps==='object')?c.swaps:{};
    c.log=Array.isArray(c.log)?c.log:[];
    c.flags=Array.isArray(c.flags)?c.flags.filter(f=>FLAGS[f]):[];
    c.updated=c.updated||Date.now();
    await saveClient(c,true);n++;
  }
  toast(n?`Загружено клиентов: ${n}`:'Новых клиентов в файле нет.');
  render();
}

    field('Где тренируется','f-equip',sel('f-equip','equip',Object.keys(EQUIP).map(k=>[k,EQUIP[k]]))),
    el('div',{class:'field'},el('label',{for:'f-method'},'Методика'),sel('f-method','method',Object.keys(METHODS).map(k=>[k,METHODS[k]])),
      el('span',{class:'muted small'},'Известные программы подходят клиентам 18–59 лет с опытом хотя бы несколько месяцев, в полном зале и без ограничений по здоровью. Остальным подбор остаётся индивидуальным.')),
    el('fieldset',{class:'field'},el('legend',{class:'lbl'},'Здоровье и ограничения'),flagsWrap,
      el('span',{class:'muted small'},'Отметьте всё, что есть. План исключит неподходящие упражнения и покажет, что согласовать с врачом.')),
    el('div',{class:'grid2'},
      field('Акцент','f-accent',sel('f-accent','accent',Object.keys(ACCENTS).map(k=>[k,ACCENTS[k]]))),
      field('Месяц программы','f-month',num('f-month','month','1'))),
    field('Заметки тренера','f-notes',el('textarea',{id:'f-notes',oninput:e=>{d.notes=e.target.value;}},d.notes||'')),
    err,
    el('div',{class:'actions'},
      el('button',{class:'btn',type:'submit'},'Собрать план'),
      el('button',{class:'btn quiet',type:'button',onclick:()=>{S.draft=null;go(S.editId?'plan':'clients');}},'Отмена')));
  return form;
}

/* ---- план ---- */
let progCache={key:'',prog:null};
function getProg(c){
  const key=JSON.stringify([c.age,c.sex,c.height,c.weight,c.goal,c.level,c.days,c.minutes,c.equip,c.flags,c.accent,c.month,c.name,c.swaps,c.method]);
  if(progCache.key!==key){progCache={key,prog:buildProgram(c)};}
  return progCache.prog;
}
function showCopy(text){
  navigator.clipboard.writeText(text).then(()=>toast('Скопировано. Можно вставить в мессенджер.'),()=>{S.copyBox=text;render();});
}
function exRow(c,prog,day,sl,i,w){
  const ctx=prog.ctx;
  const sc=slotSch(ctx,sl,w);
  const open=S.swapKey===sl.key;
  const row=[
    el('span',{class:'no'},String(i+1)),
    el('div',null,
      el('div',{class:'nm'},sl.ex.n),
      el('div',{class:'cue'},sl.ex.cue),
      el('div',{class:'tools'},
        el('button',{class:'btn ghost sm',type:'button',onclick:()=>{S.swapKey=open?null:sl.key;render();}},open?'Закрыть':'Заменить'),
        sl.manual?el('span',{class:'tag hand'},'выбрано вручную'):null)),
    el('div',null,el('div',{class:sc.txt?'sc long':'sc'},fmtSc(sc)),el('div',{class:'meta'},`отдых ${restTxt(sc.rest)}`),el('div',{class:'meta'},`RPE ${sc.rpe}`))
  ];
  const nodes=[el('div',{class:sc.txt?'ex wide':'ex'},row)];
  if(open){
    const usedOther=new Set([...prog.used].filter(id=>id!==sl.ex.id));
    const alts=candidates(sl.slot,ctx,usedOther).filter(e=>e.id!==sl.ex.id).slice(0,6);
    const panel=el('div',{class:'alts'});
    if(!alts.length)panel.append(el('span',{class:'muted small'},'Других подходящих упражнений для этого клиента нет.'));
    alts.forEach(e=>panel.append(el('button',{type:'button',onclick:async()=>{c.swaps=c.swaps||{};c.swaps[sl.key]=e.id;S.swapKey=null;await saveClient(c);render();}},e.n)));
    if(sl.manual)panel.append(el('button',{type:'button',onclick:async()=>{delete c.swaps[sl.key];S.swapKey=null;await saveClient(c);render();}},'Вернуть подбор программы'));
    nodes.push(panel);
  }
  return nodes;
}
function dayCard(c,prog,d,w){
  const ctx=prog.ctx,day=prog.days[d];
  const kids=[
    el('div',{class:'dayhead'},
      el('div',null,el('div',{class:'k'},`День ${d+1} · ${WEEKDAYS[ctx.days][d]}`),el('h2',null,day.title)),
      el('div',{class:'k'},`~${dayMinutes(prog,day,w)} мин`)),
    el('details',null,el('summary',null,'Разминка'),el('ul',null,day.warm.map(x=>el('li',null,x))))
  ];
  day.slots.forEach((s,i)=>kids.push(...exRow(c,prog,day,s,i,w)));
  if(prog.cardio&&day.cardioEx)kids.push(el('div',{class:'cardio'},el('b',null,'Кардио в конце: '),`${day.cardioEx.n}, ${prog.cardio.mins[w-1]} мин. ${prog.cardio.txt[w-1]}.`));
  kids.push(el('details',null,el('summary',null,'Заминка'),el('ul',null,day.cool.map(x=>el('li',null,x)))));
  return el('section',{class:'card'},kids);
}
function viewPlan(){
  const c=getSel();
  if(!c)return el('p',null,'Клиент не найден.');
  const prog=getProg(c);
  const out=[];
  const isDemo=c.id==='demo';
  out.push(el('section',{class:'stack-s'},
    el('h2',null,c.name),
    el('div',{class:'tags'},
      el('span',{class:'tag'},GOALS[c.goal]),
      el('span',{class:'tag plain'},LEVEL_SHORT[c.level]),
      el('span',{class:'tag plain'},`${c.days}×${c.minutes} мин`),
      el('span',{class:'tag plain'},EQUIP[c.equip]),
      c.accent&&c.accent!=='none'?el('span',{class:'tag plain'},'Акцент: '+ACCENTS[c.accent].toLowerCase()):null,
      (prog.ctx&&prog.ctx.method&&prog.ctx.method!=='auto')?el('span',{class:'tag hand'},METHOD_SHORT[prog.ctx.method]):null,
      c.month>1?el('span',{class:'tag plain'},`Месяц ${c.month}`):null),
    isDemo?el('div',{class:'banner info'},el('b',null,'Пример'),el('span',null,'Так выглядит готовый план. Создайте клиента, чтобы собрать свой.')):null));
  if(prog.blocked){
    prog.banners.forEach(b=>out.push(banner(b)));
    out.push(el('div',{class:'actions'},el('button',{class:'btn',type:'button',onclick:()=>openForm(c.id)},'Изменить анкету')));
    return el('div',{class:'stack'},out);
  }
  prog.banners.forEach(b=>out.push(banner(b)));
  const cb=copyBoxCard();if(cb)out.push(cb);
  const w=S.week;
  out.push(el('div',{class:'weeks',role:'group','aria-label':'Неделя'},[1,2,3,4].map(n=>
    el('button',{class:'wk',type:'button','aria-pressed':String(n===w),onclick:()=>{S.week=n;S.swapKey=null;render();}},el('span',{class:'n'},'Нед '+n),el('span',{class:'s'},WEEK_NAMES[n-1])))));
  const rpe=rpeFor(prog.ctx,w);
  out.push(el('section',{class:'card flat stack-s'},
    el('h3',null,`Неделя ${w}: ${WEEK_NAMES[w-1].toLowerCase()}`),
    el('p',{style:'margin:0'},weekTip(prog.ctx,w)),
    el('p',{class:'muted small',style:'margin:0'},`RPE ${rpe} из 10: подход заканчиваем, когда в запасе ещё около ${10-rpe} повторов.`)));
  prog.days.forEach((_,d)=>out.push(dayCard(c,prog,d,w)));
  out.push(el('div',{class:'actions'},
    el('button',{class:'btn',type:'button',onclick:()=>showCopy(planText(c,prog,w))},'Копировать неделю'),
    el('button',{class:'btn ghost',type:'button',onclick:()=>showCopy(planText(c,prog,'all'))},'Копировать месяц')));
  const rows=progressionRows(prog);
  out.push(el('section',{class:'card prog'},el('h3',null,'Прогрессия на месяц'),rows.map(r=>el('div',{class:'r'},
    el('span',{class:'w'},`Нед ${r.w}`),
    el('div',null,el('div',null,r.name),el('div',{class:'m'},`базовые ${r.main} · остальные ${r.acc} · RPE ${r.rpe}${r.cardio?` · кардио ${r.cardio} мин`:''}`))))));
  out.push(el('section',{class:'card stack-s'},el('h3',null,'Что учтено в подборе'),el('ul',{style:'margin:0 0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px'},prog.accounted.map(x=>el('li',null,x)))));
  out.push(el('section',{class:'card stack-s'},el('h3',null,'Сон, шаги, питание'),el('ul',{style:'margin:0 0 0 18px;padding:0;display:flex;flex-direction:column;gap:6px'},lifestyle(prog.ctx).map(x=>el('li',null,x)))));
  if(!isDemo)out.push(logCard(c));
  out.push(notesCard(c,isDemo));
  const acts=[el('button',{class:'btn quiet',type:'button',onclick:()=>isDemo?openForm(null):openForm(c.id)},isDemo?'Создать клиента':'Изменить анкету')];
  if(!isDemo){
    if(!S.confirmDel)acts.push(el('button',{class:'btn danger',type:'button',onclick:()=>{S.confirmDel=true;render();}},'Удалить клиента'));
    else{
      acts.push(el('button',{class:'btn danger',type:'button',onclick:async()=>{await deleteClient(c.id);S.sel=null;S.confirmDel=false;toast('Клиент удалён');go('clients');}},'Да, удалить'));
      acts.push(el('button',{class:'btn quiet',type:'button',onclick:()=>{S.confirmDel=false;render();}},'Отмена'));
    }
  }
  out.push(el('div',{class:'actions'},acts));
  out.push(el('p',{class:'muted small'},'План подсказка для тренера, а не медицинское назначение. Решение о нагрузке принимает тренер вместе с врачом клиента.'));
  return el('div',{class:'stack'},out);
}
function logCard(c){
  c.log=c.log||[];
  const dIn=el('input',{id:'log-d',type:'date',value:today()});
  const wIn=el('input',{id:'log-w',type:'text',inputmode:'decimal',placeholder:'Вес, кг'});
  const nIn=el('input',{id:'log-n',type:'text',placeholder:'Заметка: самочувствие, обхваты'});
  const list=[...c.log].sort((a,b)=>a.d<b.d?1:-1);
  return el('section',{class:'card stack-s'},
    el('h3',null,'Замеры'),
    el('div',{class:'grid2'},field('Дата','log-d',dIn),field('Вес','log-w',wIn)),
    field('Заметка','log-n',nIn),
    el('div',{class:'actions'},el('button',{class:'btn sm',type:'button',onclick:async()=>{
      const w=+String(wIn.value).replace(',','.');
      if(!w&&!nIn.value.trim()){toast('Введите вес или заметку.');return;}
      c.log.push({d:dIn.value||today(),w:w||null,n:nIn.value.trim()});
      await saveClient(c);render();
    }},'Добавить')),
    list.length?el('div',{class:'log'},list.map(l=>el('div',{class:'li'},
      el('span',null,`${l.d.split('-').reverse().join('.')}${l.n?' · '+l.n:''}`),
      el('span',{class:'v'},l.w?l.w+' кг':''),
      el('button',{class:'btn ghost sm',type:'button','aria-label':'Удалить замер',onclick:async()=>{c.log=c.log.filter(x=>x!==l&&!(x.d===l.d&&x.w===l.w&&x.n===l.n));await saveClient(c);render();}},'×')))):el('p',{class:'muted small',style:'margin:0'},'Записей пока нет.'));
}
function notesCard(c,isDemo){
  const ta=el('textarea',{id:'client-notes',placeholder:'Что заметили на тренировках, что поменять в следующем месяце',onchange:async e=>{c.notes=e.target.value;await saveClient(c);toast('Заметка сохранена');}},c.notes||'');
  return el('section',{class:'card stack-s'},el('h3',null,'Заметки тренера'),ta);
}

function render(){
  $app.replaceChildren();
  $app.append(header());
  if(S.loading){$app.append(el('p',{class:'muted'},'Загружаю клиентов…'));return;}
  let v;
  if(S.view==='form'&&S.draft)v=viewForm();
  else if(S.view==='plan'&&getSel())v=viewPlan();
  else{S.view='clients';v=viewClients();}
  $app.append(v);
}

/* ---- запуск ---- */
S.clients=loadLocal();
S.loading=false;
try{
  const standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)&&!lsGet('trener-hint'))S.installHint=true;
}catch(e){}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
</script>
</body>
